name: Weekly Trends Fetch

on:
  schedule:
    # Toda segunda-feira às 9h (horário UTC — ajuste se precisar de horário exato de Brasília)
    - cron: "0 9 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar script de coleta de tendências
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_trends.py

      - name: Rodar script de coleta de temas por nicho
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_niche_topics.py
